<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="index, follow, max-image-preview:large"/>
<meta name="theme-color" content="#1a1814"/>

<title>{{ site.title }}</title>
<meta name="description" content="{{ site.description | strip_newlines | strip }}"/>
<link rel="canonical" href="{{ site.url }}{{ page.url | replace:'index.html','' }}"/>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="preconnect" href="https://img.youtube.com"/>
<link rel="preconnect" href="https://www.youtube-nocookie.com"/>
<link rel="dns-prefetch" href="https://open.spotify.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>

<meta property="og:site_name" content="Smutny Pan"/>
<meta property="og:locale" content="pl_PL"/>
<meta property="og:type" content="profile"/>
<meta property="og:title" content="{{ site.title }}"/>
<meta property="og:description" content="{{ site.description | strip_newlines | strip }}"/>
<meta property="og:url" content="{{ site.url }}{{ page.url | replace:'index.html','' }}"/>
<meta property="og:image" content="{{ site.url }}/piotrek.jpg"/>
<meta property="og:image:width" content="800"/>
<meta property="og:image:height" content="800"/>
<meta property="og:image:alt" content="Smutny Pan — muzyk i animator z Krakowa"/>
<meta property="profile:username" content="smutnypan"/>

<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:title" content="{{ site.title }}"/>
<meta name="twitter:description" content="{{ site.description | strip_newlines | strip }}"/>
<meta name="twitter:image" content="{{ site.url }}/piotrek.jpg"/>
<meta name="twitter:image:alt" content="Smutny Pan — muzyk i animator z Krakowa"/>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "MusicGroup",
  "name": "Smutny Pan",
  "alternateName": "smutny_pan",
  "description": "{{ site.description | strip_newlines | strip }}",
  "url": "{{ site.url }}",
  "genre": ["indie folk", "muzyka alternatywna", "polska muzyka niezależna", "piosenka autorska"],
  "sameAs": [
    "https://www.youtube.com/@{{ site.author.youtube }}",
    "https://www.instagram.com/{{ site.author.instagram }}",
    "https://open.spotify.com/artist/{{ site.author.spotify }}"
  ],
  "image": {
    "@type": "ImageObject",
    "url": "{{ site.url }}/piotrek.jpg",
    "width": 800,
    "height": 800
  }
}
</script>

<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --ink:#1a1814;
    --paper:#f5f0e8;
    --muted:#8a8070;
    --accent:#3d2b1f;
    --rule:rgba(60,40,20,0.15);
  }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }
  .wrap{max-width:680px;margin:0 auto;padding:0 2rem;}

  header{padding:3rem 0 2rem;text-align:center;border-bottom:1.5px solid var(--ink);}
  .logo-mark{
    display:inline-block;
    width:90px;height:90px;
    border-radius:50%;
    margin-bottom:1.5rem;
    overflow:hidden;
  }
  .logo-mark img{
    width:100%;
    height:100%;
    object-fit:cover;
    filter:grayscale(100%);
    display:block;
  }
  h1{
    font-family:'Playfair Display',Georgia,serif;
    font-size:2.8rem;font-weight:700;
    letter-spacing:-0.02em;
    line-height:1;
  }
  .tagline{
    font-size:0.85rem;letter-spacing:0.18em;text-transform:uppercase;
    color:var(--muted);margin-top:0.5rem;font-weight:300;
  }

  nav{display:flex;justify-content:center;gap:2rem;padding:1.25rem 0;border-bottom:0.5px solid var(--rule);}
  nav a{
    font-size:0.8rem;letter-spacing:0.12em;text-transform:uppercase;
    color:var(--muted);text-decoration:none;font-weight:400;
    transition:color 0.2s;
  }
  nav a:hover, nav a:focus{color:var(--ink);outline:none;}
  nav a:focus-visible{outline:2px solid var(--ink);outline-offset:4px;border-radius:2px;}

  .hero{padding:3rem 0 2rem;text-align:center;}
  .hero-caption{
    font-family:'Playfair Display',Georgia,serif;
    font-size:1.15rem;
    line-height:1.5;
    font-weight:400;
    max-width:520px;
    margin:0 auto 1.25rem;
    font-style:italic;
    color:var(--ink);
  }
  .hero-subcaption{
    font-size:0.8rem;
    color:var(--muted);
    letter-spacing:0.05em;
    margin-bottom:1.5rem;
  }
  .video-embed{
    position:relative;
    width:100%;
    max-width:560px;
    margin:0 auto;
    aspect-ratio:16/9;
    border:1px solid rgba(60,40,20,0.18);
    background:var(--ink);
  }
  .video-embed iframe{
    width:100%;
    height:100%;
    border:none;
    display:block;
  }

  section{padding:3rem 0;border-top:0.5px solid var(--rule);}
  .section-label{
    font-size:0.75rem;letter-spacing:0.2em;text-transform:uppercase;
    color:var(--muted);margin-bottom:1.5rem;font-weight:400;
  }

  .video-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
  .video-card{
    border:1px solid rgba(60,40,20,0.18);
    padding:1.25rem;
    background:rgba(255,255,255,0.5);
    cursor:pointer;
    transition:background 0.2s;
    text-decoration:none;
    color:inherit;
    display:block;
  }
  .video-card:hover,.video-card:focus{background:rgba(255,255,255,0.85);}
  .video-card:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:2px;}
  .video-thumb{
    width:100%;aspect-ratio:16/9;
    background:var(--ink);
    margin-bottom:0.75rem;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .video-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .video-title{font-family:'Playfair Display',Georgia,serif;font-size:0.95rem;font-weight:400;line-height:1.3;}
  .video-views{font-size:0.75rem;color:var(--muted);margin-top:0.35rem;}

  .links-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;}
  .link-btn{
    display:flex;align-items:center;gap:0.75rem;
    padding:0.9rem 1.1rem;
    border:1px solid rgba(60,40,20,0.25);
    text-decoration:none;color:var(--ink);
    font-size:0.85rem;font-weight:400;
    background:rgba(255,255,255,0.4);
    transition:background 0.2s, border-color 0.2s;
  }
  .link-btn:hover,.link-btn:focus{background:rgba(255,255,255,0.8);border-color:var(--ink);}
  .link-btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:2px;}
  .link-btn .platform{font-size:0.75rem;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;}
  .link-btn .name{font-family:'Playfair Display',Georgia,serif;font-size:0.95rem;}

  .newsletter{
    border:1.5px solid var(--ink);
    padding:2rem;text-align:center;
  }
  .newsletter h3{font-family:'Playfair Display',Georgia,serif;font-size:1.4rem;margin-bottom:0.5rem;}
  .newsletter p{font-size:0.85rem;color:var(--muted);margin-bottom:1.25rem;line-height:1.6;}
  .email-row{display:flex;max-width:360px;margin:0 auto;}
  .email-row input{
    flex:1;padding:0.7rem 1rem;
    border:1px solid var(--ink);border-right:none;
    background:transparent;font-family:'Inter',system-ui,sans-serif;font-size:0.85rem;
    color:var(--ink);outline:none;
  }
  .email-row input::placeholder{color:var(--muted);}
  .email-row input:focus-visible{outline:2px solid var(--ink);outline-offset:0;border-right:none;}
  .email-row button{
    padding:0.7rem 1.25rem;
    background:var(--ink);color:var(--paper);
    border:1px solid var(--ink);
    font-family:'Inter',system-ui,sans-serif;font-size:0.8rem;
    letter-spacing:0.1em;text-transform:uppercase;
    cursor:pointer;
    transition:background 0.2s;
  }
  .email-row button:hover,.email-row button:focus{background:var(--accent);}
  .email-row button:focus-visible{outline:2px solid var(--paper);outline-offset:-3px;}

  footer{
    padding:2rem 0;border-top:1.5px solid var(--ink);
    display:flex;justify-content:space-between;align-items:center;
    font-size:0.75rem;color:var(--muted);
  }
  .footer-links{display:flex;gap:1.5rem;}
  .footer-links a{color:var(--muted);text-decoration:none;}
  .footer-links a:hover,.footer-links a:focus{color:var(--ink);}
  .footer-links a:focus-visible{outline:2px solid var(--ink);outline-offset:4px;border-radius:2px;}

  .yt-all{
    text-align:center;margin-top:1.25rem;
  }
  .yt-all a{
    font-size:0.8rem;letter-spacing:0.12em;text-transform:uppercase;
    color:var(--muted);text-decoration:none;
    border-bottom:0.5px solid var(--muted);padding-bottom:2px;
    transition:border-color 0.2s,color 0.2s;
  }
  .yt-all a:hover,.yt-all a:focus{color:var(--ink);border-color:var(--ink);}

  #sub-msg{margin-top:0.75rem;font-size:0.8rem;color:var(--muted);min-height:1.2em;}

  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

  @media(max-width:480px){
    h1{font-size:2rem;}
    .video-grid{grid-template-columns:1fr;}
    .links-grid{grid-template-columns:1fr;}
    nav{gap:1rem;}
  }
</style>
</head>
<body>

<main class="wrap">

  {{ content }}

</main>

<script>
function handleSubscribe(){
  var el=document.getElementById('email-input');
  var msg=document.getElementById('sub-msg');
  if(!el.value||!el.value.includes('@')){
    msg.textContent='Podaj poprawny adres e-mail.';
    msg.style.color='#a33';
    return;
  }
  msg.textContent='Dzięki! Odezwę się gdy coś nowego wyjdzie.';
  msg.style.color='#8a8070';
  el.value='';
}
</script>
</body>
</html>
